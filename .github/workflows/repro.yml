## AI-Assisted

## Living regression guard: re-assert the mount symlink-follow envelope on every
## push. push: is REQUIRED -- org-ai-assisted has no required status checks, so a
## pull_request-only trigger would never run.
##
## The envelope is util-linux-VERSION-SPECIFIC: the no-canonicalize symlink
## refusal exists in util-linux 2.41.x (Debian trixie, the platform this evidence
## targets) but NOT in 2.39.3 (Ubuntu 24.04), where every form follows. So the
## repro runs inside a Debian trixie container (util-linux 2.41.x), not directly
## on the ubuntu-24.04 runner. Checkout stays on the host so actions/checkout's
## node runtime is available; only the repro runs in the container, privileged
## for the mount/namespace capabilities.

name: repro

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    ## CI runs only where we enabled it. Unset variable -> the job is skipped,
    ## the run stays green, and forks are not handed a red X for a lane they did
    ## not opt into.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Run repro in a Debian trixie container (util-linux 2.41.x)
        ## Privileged for CAP_SYS_ADMIN (unshare --mount + mount --bind). The
        ## container runs as root, so driver.sh uses `unshare --mount` and needs
        ## no sudo. It exits non-zero if any verdict changes, failing the job.
        run: |
          docker run --rm --privileged --volume "${PWD}:/work" --workdir /work \
            debian:trixie-slim ./driver.sh
